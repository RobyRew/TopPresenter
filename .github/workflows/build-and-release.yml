name: Build & Release

# Three paths, one build:
#
#   push to main / any PR   → build + unit tests. Nothing is published.
#   push to beta            → build + tests, then a BETA release: the tag
#                             v<version>-beta.N is created here (N counts up
#                             per <version>), the release is a GitHub
#                             pre-release with its OWN immutable assets, and
#                             the Sparkle feed gets an item on the "beta"
#                             channel.
#   tag v<version>          → build + tests, then the STABLE release for that
#                             version and a feed item on no channel (Sparkle's
#                             stable). The tag must equal the project's
#                             MARKETING_VERSION, or the build fails.
#
# What this replaced, and why: every push to main used to publish a "rolling
# alpha" — one tag, moved to each commit, one release overwritten in place,
# one asset URL rewritten every time. The Sparkle feed kept the last 40 items,
# all pointing at that single URL with the signature and length of bytes that
# no longer existed. Every entry but the newest was a dead link that Sparkle
# reported as "improperly signed", and every one was on the beta channel — so
# the default (stable) channel had nothing in it at all, and a fresh install
# checking for updates was told it was up to date while build 125 sat in the
# feed. Releases here are immutable and named; the feed is pruned per channel.

on:
  push:
    branches: [main, beta]
    tags: ['v*']
  pull_request:
    branches: [main, beta]

# One run per ref at a time. Two quick pushes to `beta` would otherwise race
# for the same beta number.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: TopPresenter
  PRODUCT_NAME: TopPresenter
  # EXACT parity with the dev Mac: Xcode 26.3 (17C529) on the macos-26 arm64
  # image. Older Xcode (16.x) silently IGNORES the project's Swift 6.x settings
  # (SWIFT_DEFAULT_ACTOR_ISOLATION, approachable concurrency) — never build the
  # release with a different major Xcode than the one used for development.
  XCODE_VERSION: '26.3'
  FEED_URL: https://robyrew.github.io/TopPresenter/appcast.xml

jobs:
  build:
    name: Build & Package
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Exposed at job level so steps can gate on it: the `secrets` context is
      # not available inside a step's `if`, `env` is. Empty on forks and PRs.
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
    outputs:
      kind: ${{ steps.version.outputs.KIND }}
      version: ${{ steps.version.outputs.VERSION }}
      tag: ${{ steps.version.outputs.TAG }}
      build: ${{ github.run_number }}
      min_os: ${{ steps.version.outputs.MIN_OS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # beta numbering counts existing tags

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer" || {
            echo "::error::Xcode ${XCODE_VERSION} not on this image. Available:"
            ls /Applications | grep -i '^Xcode' || true
            exit 1
          }
          xcodebuild -version

      - name: Check README translation table is current
        # The pre-commit hook regenerates it, but hooks are opt-in per clone —
        # this makes a forgotten refresh visible instead of letting the published
        # percentages drift away from the catalog.
        run: python3 scripts/i18n_coverage.py --check

      - name: Decide what this run is
        id: version
        run: |
          # The project's MARKETING_VERSION is the version being worked on.
          BASE=$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \([^;]*\);.*/\1/p' "$PRODUCT_NAME.xcodeproj/project.pbxproj" | head -1)
          MIN_OS=$(sed -n 's/^[[:space:]]*MACOSX_DEPLOYMENT_TARGET = \([^;]*\);.*/\1/p' "$PRODUCT_NAME.xcodeproj/project.pbxproj" | head -1)
          [ -n "$BASE" ] || { echo "::error::MARKETING_VERSION not found in the project"; exit 1; }
          echo "project version: $BASE   min macOS: $MIN_OS"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGV="${GITHUB_REF_NAME#v}"
            if [[ "$TAGV" == *-* ]]; then
              echo "::error::Tags are for STABLE releases only (v$BASE). Betas come from pushing the beta branch."
              exit 1
            fi
            if [[ "$TAGV" != "$BASE" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the project's MARKETING_VERSION ($BASE). Bump the project first, or tag v$BASE."
              exit 1
            fi
            KIND=stable
            VERSION="$BASE"
            TAG="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/beta && "$GITHUB_EVENT_NAME" == push ]]; then
            KIND=beta
            # Next beta number for THIS base version: one past the highest
            # existing v<base>-beta.N. Counting instead of max would reuse a
            # number after a tag is deleted.
            git fetch --tags --force --quiet
            LAST=$(git tag -l "v${BASE}-beta.*" | sed -n "s/^v${BASE}-beta\.\([0-9]*\)$/\1/p" | sort -n | tail -1)
            N=$(( ${LAST:-0} + 1 ))
            VERSION="${BASE}-beta.${N}"
            TAG="v${VERSION}"
          else
            KIND=ci
            VERSION="${BASE}-ci.${GITHUB_RUN_NUMBER}"
            TAG=""
          fi
          echo "kind=$KIND version=$VERSION tag=$TAG"
          {
            echo "KIND=$KIND"
            echo "VERSION=$VERSION"
            echo "TAG=$TAG"
            echo "MIN_OS=$MIN_OS"
          } | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -scheme "$SCHEME" -project "$PRODUCT_NAME.xcodeproj"

      - name: Build
        run: |
          # MARKETING_VERSION carries the full string (1.0.1-beta.3) so the
          # About box, the Versions list and the feed all say the same thing —
          # the bundle used to say 1.0.0 inside a release named 1.0.0-beta.1.
          # CURRENT_PROJECT_VERSION is the run number: monotonic across every
          # branch and tag, which is what Sparkle actually compares.
          # Ad-hoc code signing ("-") so the app's entitlements (sandbox +
          # Sparkle XPC) apply with no Apple certs; the bundle is uniformly
          # RE-signed below so every nested binary carries the same identity.
          xcodebuild \
            -scheme "$SCHEME" \
            -project "$PRODUCT_NAME.xcodeproj" \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            clean build

      - name: Run unit tests (gate — failures fail the build)
        run: |
          xcodebuild \
            -scheme "$SCHEME" \
            -project "$PRODUCT_NAME.xcodeproj" \
            -destination 'platform=macOS' \
            -only-testing:TopPresenterTests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            test

      # Signing. Two modes, decided by whether the Developer ID secrets exist:
      #
      #   secrets present → Developer ID Application, hardened runtime, secure
      #                     timestamp, then notarised and stapled below.
      #   secrets absent  → ad-hoc ("-"), exactly as before. Forks and PRs
      #                     land here.
      #
      # Why this matters beyond Gatekeeper: an ad-hoc signature has no Team ID
      # and no certificate chain, and every Network-Extension firewall keys on
      # exactly that. Measured on the developer's Mac with Little Snitch: the
      # installed app's update check hung 60 s and failed with "The request
      # timed out" while the extension logged "Could not find app info … No
      # current verdict available" at the same millisecond. curl on the same
      # machine fetched the feed instantly. That is the "autoupdater doesn't
      # work" report in its entirety — the feed, the channel and Sparkle were
      # all fine — and it reproduces for every user behind such a firewall
      # until the app carries a real signature.
      #
      # Secrets: MACOS_CERTIFICATE_P12 (base64 .p12), MACOS_CERTIFICATE_PASSWORD,
      # MACOS_SIGNING_IDENTITY ("Developer ID Application: Name (TEAMID)"),
      # APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password).
      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERTIFICATE_P12 != '' }}
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign uniformly (inside-out) & verify
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          # DYLD kills the app if the process and a mapped framework carry DIFFERENT
          # Team IDs ("code signature not valid ... different Team IDs"). Guarantee
          # uniformity: sign every nested Sparkle binary and then the app itself
          # with the SAME identity, inside-out.
          APP="build/Build/Products/Release/$PRODUCT_NAME.app"
          SPK="$APP/Contents/Frameworks/Sparkle.framework"
          if [ -n "$MACOS_CERTIFICATE_P12" ] && [ -n "$MACOS_SIGNING_IDENTITY" ]; then
            IDENTITY="$MACOS_SIGNING_IDENTITY"
            # Hardened runtime + timestamp are what notarisation requires. With a
            # team-ful identity on every nested binary, library validation passes.
            OPTS=(--options runtime --timestamp)
            echo "signing with: $IDENTITY"
          else
            IDENTITY="-"
            # No --options runtime for ad-hoc: hardened runtime + team-less
            # signatures = library validation rejects the frameworks.
            OPTS=()
            echo "signing ad-hoc (no Developer ID secrets)"
          fi
          for target in \
            "$SPK/Versions/B/XPCServices/Downloader.xpc" \
            "$SPK/Versions/B/XPCServices/Installer.xpc" \
            "$SPK/Versions/B/Autoupdate" \
            "$SPK/Versions/B/Updater.app" \
            "$SPK"; do
            if [ -e "$target" ]; then
              codesign --force --sign "$IDENTITY" "${OPTS[@]}" --preserve-metadata=entitlements "$target"
            fi
          done
          codesign --force --sign "$IDENTITY" "${OPTS[@]}" --preserve-metadata=entitlements "$APP"
          echo "── verify ──"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "── identities (must all match) ──"
          for bin in "$APP" "$SPK" "$SPK/Versions/B/Autoupdate" "$SPK/Versions/B/Updater.app"; do
            codesign -dv "$bin" 2>&1 | grep -E 'Signature|TeamIdentifier' | sed "s|^|$(basename "$bin"): |"
          done

      - name: Check the bundle says what the release will say
        run: |
          APP="build/Build/Products/Release/$PRODUCT_NAME.app"
          GOT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist")
          echo "bundle: $GOT ($BUILD)"
          [ "$GOT" = "$VERSION" ] || { echo "::error::bundle version $GOT ≠ $VERSION"; exit 1; }
          [ "$BUILD" = "${{ github.run_number }}" ] || { echo "::error::bundle build $BUILD ≠ run ${{ github.run_number }}"; exit 1; }

      - name: Package app
        run: |
          APP_PATH="build/Build/Products/Release/$PRODUCT_NAME.app"
          test -d "$APP_PATH" || { echo "❌ App not found at $APP_PATH"; find build -name "*.app" -type d; exit 1; }

          # Assets are named by the FULL version so every release has its own
          # files; the feed's enclosure URLs are therefore immutable.
          cd "build/Build/Products/Release"
          ditto -c -k --keepParent "$PRODUCT_NAME.app" "$PRODUCT_NAME-$VERSION.zip"
          mv "$PRODUCT_NAME-$VERSION.zip" "$GITHUB_WORKSPACE/"

          # Create DMG — full drag-to-Applications installer UI: committed
          # background (Packaging/dmg-background.tiff, hi-dpi), positioned app
          # icon + /Applications link, volume icon from the app bundle.
          # create-dmg drives Finder via AppleScript and can be flaky on CI
          # runners → 3 attempts, then a plain hdiutil fallback so a release
          # never dies over cosmetics. Geometry stays in sync with
          # Packaging/generate-dmg-background.swift.
          brew install create-dmg
          DMG="$GITHUB_WORKSPACE/$PRODUCT_NAME-$VERSION.dmg"
          STAGE=$(mktemp -d)
          cp -R "$PRODUCT_NAME.app" "$STAGE/"
          VOLICON=$(ls "$PRODUCT_NAME.app/Contents/Resources/"*.icns 2>/dev/null | head -1 || true)
          VOLICON_ARGS=()
          [ -n "$VOLICON" ] && VOLICON_ARGS=(--volicon "$VOLICON")
          FANCY_OK=""
          for attempt in 1 2 3; do
            rm -f "$DMG"
            if create-dmg \
                --volname "$PRODUCT_NAME" \
                "${VOLICON_ARGS[@]}" \
                --background "$GITHUB_WORKSPACE/Packaging/dmg-background.tiff" \
                --window-pos 200 120 \
                --window-size 660 420 \
                --icon-size 128 \
                --text-size 13 \
                --icon "$PRODUCT_NAME.app" 165 190 \
                --hide-extension "$PRODUCT_NAME.app" \
                --app-drop-link 495 190 \
                --no-internet-enable \
                "$DMG" "$STAGE"; then
              FANCY_OK=1
              break
            fi
            echo "create-dmg attempt $attempt failed — retrying…"
            sleep 5
          done
          if [ -z "$FANCY_OK" ]; then
            echo "⚠️ create-dmg failed 3× — falling back to plain hdiutil DMG"
            rm -f "$DMG"
            hdiutil create -volname "$PRODUCT_NAME" -srcfolder "$PRODUCT_NAME.app" -ov -format UDZO "$DMG"
          fi

          # Verify the DMG mounts and carries the installer layout.
          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          ls -la "$MOUNT"
          test -d "$MOUNT/$PRODUCT_NAME.app" || { echo "❌ app missing from DMG"; hdiutil detach "$MOUNT"; exit 1; }
          if [ -n "$FANCY_OK" ]; then
            test -e "$MOUNT/Applications" || { echo "❌ Applications link missing"; hdiutil detach "$MOUNT"; exit 1; }
            test -d "$MOUNT/.background" || { echo "❌ background folder missing"; hdiutil detach "$MOUNT"; exit 1; }
            echo "✓ installer UI verified (app + Applications link + background)"
          fi
          hdiutil detach "$MOUNT"

      - name: Notarise and staple
        if: ${{ env.MACOS_CERTIFICATE_P12 != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # The zip is what Sparkle installs and the DMG is what people
          # download; both are submitted, the app inside is stapled, and the
          # zip is rebuilt from the stapled app so the ticket travels with it.
          APP="build/Build/Products/Release/$PRODUCT_NAME.app"
          ZIP="$PRODUCT_NAME-$VERSION.zip"
          DMG="$PRODUCT_NAME-$VERSION.dmg"
          xcrun notarytool submit "$ZIP" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP"
          rm -f "$ZIP"
          ( cd "build/Build/Products/Release" && ditto -c -k --keepParent "$PRODUCT_NAME.app" "$GITHUB_WORKSPACE/$ZIP" )
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TopPresenter-${{ env.VERSION }}
          path: |
            TopPresenter-*.zip
            TopPresenter-*.dmg
          retention-days: 30

  # ---------------------------------------------------------------- BETA
  # Publishing the release and deploying the feed are one job here. The
  # `github-pages` environment must permit the `beta` BRANCH (Settings →
  # Environments → github-pages → Deployment branches and tags), because this
  # job runs from the branch push, before its tag exists. The rule was added
  # alongside this workflow; if it is ever removed the job is rejected at the
  # gate before a step runs, and no beta is published at all.
  beta:
    name: Beta Release
    needs: build
    if: needs.build.outputs.kind == 'beta'
    runs-on: macos-26
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}

    steps:
      - name: Checkout (for appcast scripts)
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: TopPresenter-*
          merge-multiple: true

      - name: Create the beta tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "TopPresenter $VERSION"
          git push origin "refs/tags/$TAG"

      - name: Create beta pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: "TopPresenter ${{ env.VERSION }}"
          prerelease: true
          generate_release_notes: true
          body: |
            ### 🧪 Beta ${{ env.VERSION }}

            **Build:** ${{ needs.build.outputs.build }} · **Commit:** `${{ github.sha }}`

            Offered to the **Beta** update channel (Settings ▸ Actualizări ▸ Canal).
            Stable users are not offered betas.

            > If this build is unsigned (no Developer ID configured in CI), macOS will
            > refuse to open it on first launch: right-click the app → Open → Open,
            > or run `xattr -cr TopPresenter.app`.
          files: |
            TopPresenter-*.zip
            TopPresenter-*.dmg

      - name: Build signed appcast (beta channel)
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        env:
          ZIP: TopPresenter-${{ env.VERSION }}.zip
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/TopPresenter-${{ env.VERSION }}.zip
          SHORT_VERSION: ${{ env.VERSION }}
          BUILD_VERSION: ${{ needs.build.outputs.build }}
          CHANNEL: beta
          MIN_OS: ${{ needs.build.outputs.min_os }}
          NOTES: "Beta ${{ env.VERSION }}"
        run: |
          chmod +x scripts/publish_appcast.sh
          scripts/publish_appcast.sh

      - name: Setup Pages
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/configure-pages@v6

      - name: Upload appcast artifact
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy appcast to Pages
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/deploy-pages@v5

  # ---------------------------------------------------------------- STABLE
  release:
    name: Stable Release
    needs: build
    if: needs.build.outputs.kind == 'stable'
    runs-on: macos-26
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Checkout (for appcast scripts)
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: TopPresenter-*
          merge-multiple: true

      - name: Create stable release
        uses: softprops/action-gh-release@v3
        with:
          name: "TopPresenter ${{ env.VERSION }}"
          generate_release_notes: true
          make_latest: true
          body: |
            ### 🎉 TopPresenter ${{ env.VERSION }}

            **Build:** ${{ needs.build.outputs.build }} · **Commit:** `${{ github.sha }}`

            > If this build is unsigned (no Developer ID configured in CI), macOS will
            > refuse to open it on first launch: right-click the app → Open → Open,
            > or run `xattr -cr TopPresenter.app`.
          files: |
            TopPresenter-*.zip
            TopPresenter-*.dmg

      - name: Build signed appcast (stable channel)
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        env:
          ZIP: TopPresenter-${{ env.VERSION }}.zip
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/TopPresenter-${{ env.VERSION }}.zip
          SHORT_VERSION: ${{ env.VERSION }}
          BUILD_VERSION: ${{ needs.build.outputs.build }}
          CHANNEL: ""
          MIN_OS: ${{ needs.build.outputs.min_os }}
          NOTES: "TopPresenter ${{ env.VERSION }}"
        run: |
          chmod +x scripts/publish_appcast.sh
          scripts/publish_appcast.sh

      - name: Setup Pages
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/configure-pages@v6

      - name: Upload appcast artifact
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy appcast to Pages
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/deploy-pages@v5
