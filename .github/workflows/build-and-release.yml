name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: TopPresenter
  PRODUCT_NAME: TopPresenter
  # EXACT parity with the dev Mac: Xcode 26.3 (17C529) on the macos-26 arm64
  # image. Older Xcode (16.x) silently IGNORES the project's Swift 6.x settings
  # (SWIFT_DEFAULT_ACTOR_ISOLATION, approachable concurrency) — never build the
  # release with a different major Xcode than the one used for development.
  XCODE_VERSION: '26.3'

jobs:
  build:
    name: Build & Package
    runs-on: macos-26
    timeout-minutes: 40
    outputs:
      version: ${{ steps.package.outputs.VERSION }}
      build: ${{ steps.package.outputs.BUILD }}
      prerelease_tag: ${{ steps.package.outputs.PRERELEASE_TAG }}
      prerelease_version: ${{ steps.package.outputs.PRERELEASE_VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer" || {
            echo "::error::Xcode ${XCODE_VERSION} not on this image. Available:"
            ls /Applications | grep -i '^Xcode' || true
            exit 1
          }
          xcodebuild -version

      - name: Check README translation table is current
        # The pre-commit hook regenerates it, but hooks are opt-in per clone —
        # this makes a forgotten refresh visible instead of letting the published
        # percentages drift away from the catalog.
        run: python3 scripts/i18n_coverage.py --check

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -scheme "$SCHEME" -project "$PRODUCT_NAME.xcodeproj"

      - name: Build
        run: |
          # Monotonic CFBundleVersion so Sparkle can tell releases apart (the project's
          # CURRENT_PROJECT_VERSION is a fixed 1). Ad-hoc code signing ("-") so the app's
          # entitlements (sandbox + Sparkle XPC) apply with no Apple certs; the bundle is
          # uniformly RE-signed below so every nested binary carries the same identity.
          xcodebuild \
            -scheme "$SCHEME" \
            -project "$PRODUCT_NAME.xcodeproj" \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            clean build

      - name: Run unit tests (gate — failures fail the build)
        run: |
          xcodebuild \
            -scheme "$SCHEME" \
            -project "$PRODUCT_NAME.xcodeproj" \
            -destination 'platform=macOS' \
            -only-testing:TopPresenterTests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            test

      - name: Re-sign uniformly (ad-hoc, inside-out) & verify
        run: |
          # DYLD kills the app if the process and a mapped framework carry DIFFERENT
          # Team IDs ("code signature not valid ... different Team IDs"). Guarantee
          # uniformity: re-sign every nested Sparkle binary and then the app itself
          # with the SAME ad-hoc identity, inside-out. No --options runtime here:
          # hardened runtime + ad-hoc (team-less) signatures = library validation
          # rejects the frameworks; plain ad-hoc launches everywhere.
          APP="build/Build/Products/Release/$PRODUCT_NAME.app"
          SPK="$APP/Contents/Frameworks/Sparkle.framework"
          for target in \
            "$SPK/Versions/B/XPCServices/Downloader.xpc" \
            "$SPK/Versions/B/XPCServices/Installer.xpc" \
            "$SPK/Versions/B/Autoupdate" \
            "$SPK/Versions/B/Updater.app" \
            "$SPK"; do
            if [ -e "$target" ]; then
              codesign --force --sign - --preserve-metadata=entitlements "$target"
            fi
          done
          codesign --force --sign - --preserve-metadata=entitlements "$APP"
          echo "── verify ──"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "── identities (must ALL be adhoc, no TeamIdentifier) ──"
          for bin in "$APP" "$SPK" "$SPK/Versions/B/Autoupdate" "$SPK/Versions/B/Updater.app"; do
            codesign -dv "$bin" 2>&1 | grep -E 'Signature|TeamIdentifier' | sed "s|^|$(basename "$bin"): |"
          done

      - name: Package app
        id: package
        run: |
          APP_PATH="build/Build/Products/Release/$PRODUCT_NAME.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ App not found at $APP_PATH"
            find build -name "*.app" -type d
            exit 1
          fi

          # Get version info
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist" 2>/dev/null || echo "1.0")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Contents/Info.plist" 2>/dev/null || echo "1")

          # ONE rolling alpha, not one per commit.
          #
          # This counted existing tags and incremented, so every push to main
          # left a permanent release behind — 72 of them accumulated before
          # anyone looked, and deleting them by hand only bought an hour. The
          # tag is fixed now (`v<version>-alpha`) and the release is overwritten
          # in place, so "the latest build of main" is always exactly one entry.
          #
          # The build number still climbs (CFBundleVersion, from the run number)
          # which is what Sparkle actually compares, so auto-update keeps
          # working across overwrites.
          git fetch --tags --force --quiet

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV
          echo "PRERELEASE_VERSION=$VERSION-alpha" >> $GITHUB_ENV
          echo "PRERELEASE_TAG=v$VERSION-alpha" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD=$BUILD" >> $GITHUB_OUTPUT
          echo "PRERELEASE_VERSION=$VERSION-alpha" >> $GITHUB_OUTPUT
          echo "PRERELEASE_TAG=v$VERSION-alpha" >> $GITHUB_OUTPUT

          # Create ZIP
          cd "build/Build/Products/Release"
          ditto -c -k --keepParent "$PRODUCT_NAME.app" "$PRODUCT_NAME-$VERSION.zip"
          mv "$PRODUCT_NAME-$VERSION.zip" "$GITHUB_WORKSPACE/"

          # Create DMG — full drag-to-Applications installer UI: committed
          # background (Packaging/dmg-background.tiff, hi-dpi), positioned app
          # icon + /Applications link, volume icon from the app bundle.
          # create-dmg drives Finder via AppleScript and can be flaky on CI
          # runners → 3 attempts, then a plain hdiutil fallback so a release
          # never dies over cosmetics. Geometry stays in sync with
          # Packaging/generate-dmg-background.swift.
          brew install create-dmg
          DMG="$GITHUB_WORKSPACE/$PRODUCT_NAME-$VERSION.dmg"
          STAGE=$(mktemp -d)
          cp -R "$PRODUCT_NAME.app" "$STAGE/"
          VOLICON=$(ls "$PRODUCT_NAME.app/Contents/Resources/"*.icns 2>/dev/null | head -1 || true)
          VOLICON_ARGS=()
          [ -n "$VOLICON" ] && VOLICON_ARGS=(--volicon "$VOLICON")
          FANCY_OK=""
          for attempt in 1 2 3; do
            rm -f "$DMG"
            if create-dmg \
                --volname "$PRODUCT_NAME" \
                "${VOLICON_ARGS[@]}" \
                --background "$GITHUB_WORKSPACE/Packaging/dmg-background.tiff" \
                --window-pos 200 120 \
                --window-size 660 420 \
                --icon-size 128 \
                --text-size 13 \
                --icon "$PRODUCT_NAME.app" 165 190 \
                --hide-extension "$PRODUCT_NAME.app" \
                --app-drop-link 495 190 \
                --no-internet-enable \
                "$DMG" "$STAGE"; then
              FANCY_OK=1
              break
            fi
            echo "create-dmg attempt $attempt failed — retrying…"
            sleep 5
          done
          if [ -z "$FANCY_OK" ]; then
            echo "⚠️ create-dmg failed 3× — falling back to plain hdiutil DMG"
            rm -f "$DMG"
            hdiutil create -volname "$PRODUCT_NAME" \
              -srcfolder "$PRODUCT_NAME.app" \
              -ov -format UDZO "$DMG"
          fi

          # Verify the DMG mounts and carries the installer layout.
          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          ls -la "$MOUNT"
          test -d "$MOUNT/$PRODUCT_NAME.app" || { echo "❌ app missing from DMG"; hdiutil detach "$MOUNT"; exit 1; }
          if [ -n "$FANCY_OK" ]; then
            test -e "$MOUNT/Applications" || { echo "❌ Applications link missing"; hdiutil detach "$MOUNT"; exit 1; }
            test -d "$MOUNT/.background" || { echo "❌ background folder missing"; hdiutil detach "$MOUNT"; exit 1; }
            echo "✓ installer UI verified (app + Applications link + background)"
          fi
          hdiutil detach "$MOUNT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: TopPresenter-${{ env.VERSION }}
          path: |
            TopPresenter-*.zip
            TopPresenter-*.dmg
          retention-days: 30

  # Unique pre-release on every push to main
  pre-release:
    name: Pre-release (Alpha)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: macos-26
    permissions:
      contents: write
      pages: write        # deploy the appcast to Pages (no gh-pages branch)
      id-token: write     # required by actions/deploy-pages
    environment:
      name: github-pages
    env:
      # Empty until you add the repo secret — the appcast steps then no-op (CI stays green).
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

    steps:
      - name: Checkout (for appcast scripts)
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: TopPresenter-*
          merge-multiple: true

      - name: Get short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # The rolling tag has to MOVE, and the release action will not move one it
      # did not create. Without this the release keeps updating its assets while
      # its tag still points at whatever commit first created it — the download
      # is right and the "source code" links are a lie.
      - name: Move the rolling alpha tag to this commit
        env:
          TAG: ${{ needs.build.outputs.prerelease_tag }}
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

      - name: Create alpha pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.prerelease_tag }}
          name: "TopPresenter ${{ needs.build.outputs.prerelease_version }}"
          prerelease: true
          # No generated notes on a rolling release: they would be the diff since
          # the tag, and the tag is always the previous push.
          generate_release_notes: false
          body: |
            ### ⚡ Latest build of `main`

            This release is **overwritten on every push**. It is always the tip
            of `main`, never a fixed point in history — if you need a build that
            stays put, use a tagged beta or stable release.

            **Version:** `${{ needs.build.outputs.prerelease_version }}` (build ${{ needs.build.outputs.build }})
            **Commit:** `${{ github.sha }}`
            **Built:** ${{ github.event.head_commit.timestamp }}

            > ⚠️ This is an unsigned build. To open on macOS:
            > Right-click the app → Open → Open (bypass Gatekeeper).
            > Or run: `xattr -cr TopPresenter.app`

            ---
            **Commit message:** ${{ github.event.head_commit.message }}
          files: |
            TopPresenter-*.zip
            TopPresenter-*.dmg

      - name: Build signed appcast (beta channel)
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        env:
          ZIP: TopPresenter-${{ needs.build.outputs.version }}.zip
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.prerelease_tag }}/TopPresenter-${{ needs.build.outputs.version }}.zip
          SHORT_VERSION: ${{ needs.build.outputs.prerelease_version }}
          BUILD_VERSION: ${{ github.run_number }}
          CHANNEL: beta
          FEED_URL: https://robyrew.github.io/TopPresenter/appcast.xml
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          chmod +x scripts/publish_appcast.sh
          scripts/publish_appcast.sh

      - name: Setup Pages
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/configure-pages@v6

      - name: Upload appcast artifact
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy appcast to Pages
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/deploy-pages@v5

  # Named beta on a v*-beta.N tag (v0.1.0-beta.1, v0.1.0-beta.2, …).
  #
  # The repo had exactly two paths — an automatic alpha on every push to main,
  # and a stable release on a tag with no `-` — so there was no way to publish a
  # beta at all: a `-beta.` tag built and then matched neither job, producing
  # artifacts nobody could download. A beta is a DELIBERATE, named build, which
  # is what distinguishes it from the alpha that every push already emits.
  #
  # Same appcast channel as alpha ("beta"), so existing beta-channel subscribers
  # are offered it without any client change.
  # Publishing the release and deploying the appcast are SEPARATE jobs on
  # purpose. The `github-pages` environment only permits the `main` and
  # `gh-pages` branches, so a job claiming it from a TAG is rejected at the gate
  # before a single step runs:
  #
  #   Tag "v0.1.0-beta.1" is not allowed to deploy to github-pages due to
  #   environment protection rules.
  #
  # With both in one job that took the release down with it. Split, the beta
  # always publishes, and only the Sparkle feed update depends on the repo
  # allowing tag deployments (Settings → Environments → github-pages →
  # Deployment branches and tags → add a `v*` tag rule).
  beta:
    name: Beta Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.')
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: TopPresenter-*
          merge-multiple: true

      - name: Derive version from the tag
        # The TAG is the source of truth for a beta's name — the counter cannot
        # be inferred the way the alpha's is.
        run: echo "BETA_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Create beta pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "TopPresenter ${{ env.BETA_VERSION }}"
          prerelease: true
          generate_release_notes: true
          body: |
            ### 🧪 Beta

            **Version:** `${{ env.BETA_VERSION }}`
            **Tag:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`

            A deliberate beta build, not the automatic alpha that every push to
            `main` produces. Offered to the **beta** update channel.

            > ⚠️ This is an unsigned build. To open on macOS:
            > Right-click the app → Open → Open (bypass Gatekeeper).
            > Or run: `xattr -cr TopPresenter.app`
          files: |
            TopPresenter-*.zip
            TopPresenter-*.dmg

  # Offers the beta to Sparkle's beta channel. Needs the `github-pages`
  # environment to permit tag deployments — until it does, THIS job fails while
  # the release above still publishes, which is the failure mode we want.
  beta-appcast:
    name: Beta Appcast
    needs: [build, beta]
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.')
    runs-on: macos-26
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

    steps:
      - name: Checkout (for appcast scripts)
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: TopPresenter-*
          merge-multiple: true

      - name: Derive version from the tag
        run: echo "BETA_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build signed appcast (beta channel)
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        env:
          ZIP: TopPresenter-${{ needs.build.outputs.version }}.zip
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/TopPresenter-${{ needs.build.outputs.version }}.zip
          SHORT_VERSION: ${{ env.BETA_VERSION }}
          BUILD_VERSION: ${{ github.run_number }}
          CHANNEL: beta
          FEED_URL: https://robyrew.github.io/TopPresenter/appcast.xml
          NOTES: "Beta ${{ env.BETA_VERSION }}"
        run: |
          chmod +x scripts/publish_appcast.sh
          scripts/publish_appcast.sh

      - name: Setup Pages
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/configure-pages@v6

      - name: Upload appcast artifact
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy appcast to Pages
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/deploy-pages@v5

  # Stable release on final version tags (v1.0.0, v1.1.0, etc.)
  #
  # NOTE: this job has the SAME environment problem the beta job just hit — it
  # claims `github-pages` and only ever runs from a tag, so the first stable
  # release will be rejected at the gate unless a `v*` tag rule is added to the
  # environment. It has never fired (every tag so far is a pre-release), so the
  # bug has stayed invisible.
  release:
    name: Stable Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: macos-26
    permissions:
      contents: write
      pages: write        # deploy the appcast to Pages (no gh-pages branch)
      id-token: write     # required by actions/deploy-pages
    environment:
      name: github-pages
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

    steps:
      - name: Checkout (for appcast scripts)
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: TopPresenter-*
          merge-multiple: true

      - name: Create stable release
        uses: softprops/action-gh-release@v3
        with:
          name: "TopPresenter ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ### 🎉 TopPresenter ${{ github.ref_name }}

            > ⚠️ This is an unsigned build. To open on macOS:
            > Right-click the app → Open → Open (bypass Gatekeeper).
            > Or run: `xattr -cr TopPresenter.app`
          files: |
            TopPresenter-*.zip
            TopPresenter-*.dmg

      - name: Build signed appcast (stable channel)
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        env:
          ZIP: TopPresenter-${{ needs.build.outputs.version }}.zip
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/TopPresenter-${{ needs.build.outputs.version }}.zip
          SHORT_VERSION: ${{ needs.build.outputs.version }}
          BUILD_VERSION: ${{ github.run_number }}
          CHANNEL: ""
          FEED_URL: https://robyrew.github.io/TopPresenter/appcast.xml
        run: |
          chmod +x scripts/publish_appcast.sh
          scripts/publish_appcast.sh

      - name: Setup Pages
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/configure-pages@v6

      - name: Upload appcast artifact
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy appcast to Pages
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        uses: actions/deploy-pages@v5
